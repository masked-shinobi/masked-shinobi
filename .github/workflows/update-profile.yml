name: Refresh profile visuals
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate profile
        run: |
          python scripts/gen.py
          python scripts/stats.py
          python scripts/check_assets.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: masked-shinobi
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
      - name: Commit generated assets
        run: |
          git config user.name "profile-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md assets scripts
          if git diff --cached --quiet; then echo "No profile changes."; else git commit -m "chore: refresh profile [skip ci]" && git push; fi
