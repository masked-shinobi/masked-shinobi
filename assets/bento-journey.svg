
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" fill="none">
  <defs>
    <radialGradient id="gR" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#ff2e4d" stop-opacity=".17"/>
      <stop offset="1" stop-color="#ff2e4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gC" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gV" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#b36bff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#b36bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1000" height="290" rx="22" fill="#050505"/>
  <rect width="1000" height="290" rx="22" fill="url(#grid)"/>

  <!-- Education panel -->
  <rect x="0" y="0" width="400" height="290" rx="18" fill="#0c0c0f" stroke="#23232b"/>
  <rect x="0" y="0" width="400" height="290" rx="18" fill="url(#gC)"/>

  <text x="28" y="38" font-family="monospace" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="2">// EDUCATION</text>
  <text x="28" y="76" font-family="Arial,sans-serif" font-size="19" fill="#fff">SRM Institute of Science</text>
  <text x="28" y="101" font-family="Arial,sans-serif" font-size="19" fill="#fff">and Technology</text>
  <text x="28" y="140" font-family="monospace" font-size="13" font-weight="500" fill="#00e5ff">Computer Science · 3rd Year</text>
  <text x="28" y="162" font-family="monospace" font-size="12" fill="#8b8b99">Chennai, India</text>

  <!-- Developer profile replacing CGPA -->
  <line x1="28" y1="185" x2="372" y2="185" stroke="#292932"/>
  <text x="28" y="208" font-family="monospace" font-size="10" font-weight="700" fill="#8b8b99" letter-spacing="1.5">// CURRENT FOCUS</text>
  <text x="28" y="237" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Building. Learning.</text>
  <text x="28" y="261" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#00e5ff">Leveling Up.</text>
  <circle cx="352" cy="249" r="13" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".4"/>
  <path d="M347 249 L351 253 L358 245" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Timeline -->
  <line x1="440" y1="52" x2="440" y2="247" stroke="#2a2a33" stroke-dasharray="3 5"/>

  <!-- Research -->
  <rect x="412" y="0" width="588" height="86" rx="18" fill="#0c0c0f" stroke="#23232b"/>
  <rect x="412" y="0" width="588" height="86" rx="18" fill="url(#gR)"/>
  <circle cx="440" cy="43" r="9" fill="#050505" stroke="#ff2e4d" stroke-width="2"/>
  <circle cx="440" cy="43" r="3.5" fill="#ff2e4d">
    <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="472" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">King Faisal University</text>
  <text x="472" y="62" font-family="monospace" font-size="12.5" font-weight="500" fill="#ff2e4d">AI / ML Research</text>
  <rect x="890" y="32" width="70" height="22" rx="11" fill="#ff2e4d" fill-opacity=".1" stroke="#ff2e4d" stroke-opacity=".4"/>
  <text x="925" y="47" font-family="monospace" font-size="10.5" fill="#ff2e4d" text-anchor="middle">Research</text>

  <!-- Web engineering -->
  <rect x="412" y="102" width="588" height="86" rx="18" fill="#0c0c0f" stroke="#23232b"/>
  <rect x="412" y="102" width="588" height="86" rx="18" fill="url(#gC)"/>
  <circle cx="440" cy="145" r="9" fill="#050505" stroke="#00e5ff" stroke-width="2"/>
  <circle cx="440" cy="145" r="3.5" fill="#00e5ff">
    <animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="472" y="140" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">CJ Network</text>
  <text x="472" y="164" font-family="monospace" font-size="12.5" font-weight="500" fill="#00e5ff">Web Engineering</text>
  <rect x="890" y="134" width="70" height="22" rx="11" fill="#00e5ff" fill-opacity=".1" stroke="#00e5ff" stroke-opacity=".4"/>
  <text x="925" y="149" font-family="monospace" font-size="10.5" fill="#00e5ff" text-anchor="middle">Industry</text>

  <!-- Software development -->
  <rect x="412" y="204" width="588" height="86" rx="18" fill="#0c0c0f" stroke="#23232b"/>
  <rect x="412" y="204" width="588" height="86" rx="18" fill="url(#gV)"/>
  <circle cx="440" cy="247" r="9" fill="#050505" stroke="#b36bff" stroke-width="2"/>
  <circle cx="440" cy="247" r="3.5" fill="#b36bff">
    <animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="472" y="242" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Infosys</text>
  <text x="472" y="266" font-family="monospace" font-size="12.5" font-weight="500" fill="#b36bff">Python Software Development</text>
  <rect x="890" y="236" width="70" height="22" rx="11" fill="#b36bff" fill-opacity=".1" stroke="#b36bff" stroke-opacity=".4"/>
  <text x="925" y="251" font-family="monospace" font-size="10.5" fill="#b36bff" text-anchor="middle">Industry</text>
</svg>
