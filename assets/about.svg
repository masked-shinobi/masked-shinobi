</style><rect x=".5" y=".5" width="999" height="440" rx="20" fill="#0c0c0e" stroke="#232327"/><text x="48" y="54" font-size="13" letter-spacing="4" fill="#d6392d" class="b">WHO</text><text x="48" y="96" font-size="20" fill="#cbc6bb">I'm a Design Engineer and third-year Computer</text><text x="48" y="129" font-size="20" fill="#cbc6bb">Science student at SRM Institute of Science and</text><text x="48" y="162" font-size="20" fill="#cbc6bb">Technology, Chennai, studying on a Merit</text><text x="48" y="195" font-size="20" fill="#cbc6bb">Scholarship.</text><text x="48" y="246" font-size="20" fill="#cbc6bb">I work where creative frontends, scalable cloud</text><text x="48" y="279" font-size="20" fill="#cbc6bb">platforms and AI-driven intelligence meet, from</text><text x="48" y="312" font-size="20" fill="#cbc6bb">AI/ML research at King Faisal University to web</text><text x="48" y="345" font-size="20" fill="#cbc6bb">engineering at CJ Network and Python</text><text x="48" y="378" font-size="20" fill="#cbc6bb">development at Infosys.</text><line x1="568" y1="48" x2="568" y2="393" stroke="#232327"/><text x="616" y="54" font-size="13" letter-spacing="4" fill="#d6392d" class="b">FOCUS</text><text x="616" y="108.0" font-size="15" fill="#b3261e" class="b">01</text><text x="656" y="108.0" font-size="22" class="b" fill="#ece7dd">Creative frontends</text><text x="656" y="136.0" font-size="15" fill="#8d8a84">Motion-led interfaces with GSAP and</text><text x="656" y="158.0" font-size="15" fill="#8d8a84">Three.js.</text><line x1="616" y1="173.66666666666669" x2="952" y2="173.66666666666669" stroke="#232327"/><text x="616" y="205.66666666666669" font-size="15" fill="#b3261e" class="b">02</text><text x="656" y="205.66666666666669" font-size="22" class="b" fill="#ece7dd">Cloud &amp; security</text><text x="656" y="233.66666666666669" font-size="15" fill="#8d8a84">Docker, Kubernetes and CI/CD that ship</text><text x="656" y="255.66666666666669" font-size="15" fill="#8d8a84">cleanly.</text